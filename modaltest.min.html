<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <style>*{margin:0;padding:0;box-sizing:border-box}h1{text-align:center;padding:20px}.gallery{display:flex;flex-wrap:wrap;justify-content:flex-start;padding:0 15px}.gallery-item{position:relative;width:calc(25% - 20px);height:auto;margin:10px;cursor:pointer;transition:transform .5s ease}.gallery-item:hover{transform:scale(1.1)}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.8);align-items:center;justify-content:center;transition:opacity .5s ease}.modal-content{position:relative;width:auto;height:auto;max-width:90%;max-height:90%;border-radius:5px;overflow:hidden;animation:zoomIn .5s}@keyframes zoomIn{from{transform:scale(.6)}to{transform:scale(1)}}.modal.show{display:flex;opacity:1}.close{position:absolute;top:10px;right:15px;color:#fff;font-size:35px;font-weight:700;cursor:pointer;transition:transform .3s}.caption{position:absolute;bottom:15px;width:100%;text-align:center;color:#fff;font-size:24px}@media screen and (max-width:768px){.gallery-item{width:calc(50% - 20px)}}@media screen and (max-width:480px){.gallery-item{width:calc(100% - 20px)}}</style> <link rel="stylesheet" href="style.css"> <title>Modal Test</title> </head> <body> <h1>Responsive Modal Images</h1> <div class="gallery"> <img src="images\Ghosts\IMG_0012.jpg" alt="Cinque Terre" class="gallery-item" onclick='openModal("modal1","Ghost")'> <img src="images\Ghosts\IMG_0070.jpg" alt="Forest" class="gallery-item" onclick='openModal("modal2","Forest")'> <img src="images\Demons\IMG_3379.jpg" alt="Northern Lights" class="gallery-item" onclick='openModal("modal3","Nothern Lights")'> <img src="images\Hive\image 4.JPEG" alt="Mountains" class="gallery-item" onclick='openModal("modal4","Mountains")'> </div> <div id="modal1" class="modal"> <span class="close" onclick='closeModal("modal1")'>&times;</span> <img src="images\Ghosts\IMG_0012.jpg" alt="Cinque Terre" class="modal-content">  </div> <div id="modal2" class="modal"> <span class="close" onclick='closeModal("modal2")'>&times;</span> <img src="images\Ghosts\IMG_0070.jpg" alt="Forest" class="modal-content">  </div> <div id="modal3" class="modal"> <span class="close" onclick='closeModal("modal3")'>&times;</span> <img src="images\Ghosts\IMG_0070.jpg" alt="Northern Lights" class="modal-content">  </div> <div id="modal4" class="modal"> <span class="close" onclick='closeModal("modal4")'>&times;</span> <img src="images\Ghosts\IMG_0070.jpg" alt="Mountains" class="modal-content">  </div>  <script>function openModal(e,t){let n=document.getElementById(e);n.style.display="flex",n.classList.add("show"),n.querySelector(".caption").innerText=t}function closeModal(e){let t=document.getElementById(e);t.classList.remove("show"),setTimeout((function(){t.style.display="none",t.querySelector(".caption").innerText=""}),300)}</script>
